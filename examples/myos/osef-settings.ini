# OSEF settings, edited by the OSEF editor (Settings panel).
# The editor turns them into osef_generated.cpp; edit either here or in the editor.

[appearance]
welcome = Welcome to MYOS
prompt = {os}:{cwd}$\s
text_color = bright-green
background = black
prompt_name_color = green
prompt_path_color = bright-green
text_size = 0

[features]
shell = yes
start_program = sh
