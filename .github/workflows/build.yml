name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The engine, the osef-image tool, the examples and the tests as native
  # programs (CMake), plus the Makefile path on Linux and macOS.
  hosted:
    name: hosted (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release -DOSEF_BUILD_ISO=OFF

      - name: Build
        run: cmake --build build-cmake --config Release --parallel

      - name: Test (core, kernel, hardware declarations)
        run: ctest --test-dir build-cmake -C Release --output-on-failure

      - name: Makefile build and tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BM_CXX="$(command -v clang++ || command -v clang++-18 || echo clang++)"
          make -j4 BM_CXX="$BM_CXX"
          make test BM_CXX="$BM_CXX"

  # Bootable ISOs: freestanding kernels (clang + lld), Limine, xorriso, and
  # boot tests in QEMU with SeaBIOS (BIOS OSes) and OVMF (UEFI OSes).
  bare-metal:
    runs-on: ubuntu-latest
    env:
      QEMU: /usr/bin/qemu-system-x86_64
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld xorriso qemu-system-x86 ovmf ninja-build

      - name: Find the UEFI firmware
        run: |
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/ovmf/OVMF.fd; do
            if [ -f "$f" ]; then echo "OVMF=$f" >> "$GITHUB_ENV"; echo "UEFI firmware: $f"; break; fi
          done

      - name: Limine
        run: tools/bootstrap/limine.sh

      - name: Tool summary
        run: tools/bootstrap.sh --check --with-qemu

      # OSEF_BUILD_ISO=ON: configuring fails if clang, ld.lld, xorriso or Limine is missing.
      - name: Configure
        run: >-
          cmake -S . -B build-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DOSEF_BUILD_ISO=ON
          -DOSEF_QEMU="$QEMU" -DOSEF_OVMF="$OVMF"

      - name: Build (engine, tests, kernels, ISOs)
        run: cmake --build build-cmake

      - name: Test
        run: ctest --test-dir build-cmake --output-on-failure

      - name: Boot tests (CMake ISOs)
        env:
          OSEF_IMAGE: ${{ github.workspace }}/build-cmake/osef-image
          XORRISO: xorriso
          BUILD: ${{ github.workspace }}/build-cmake/images
        run: bash tests/iso/boot_test.sh minimal myos

      # The editor drives the Makefile (make iso / run-iso OS_DIR=...), so test it too.
      - name: Makefile ISO pipeline
        run: |
          make -j4 iso BM_CXX=clang++
          OSEF_CROSS_CHECK=0 make test-iso BM_CXX=clang++ QEMU="$QEMU" OVMF="$OVMF"

      - name: Upload ISOs, serial logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osef-iso
          if-no-files-found: ignore
          path: |
            build-cmake/images/*.iso
            build-cmake/images/*.log
            build-cmake/images/*.png
            build/*-serial.log
            build/*-screen.png

  # The OSEF editor (the app): build + unit tests on every OS, packaged for
  # the release. Windows is still experimental (see README), so a failure
  # there doesn't block a release.
  editor:
    name: editor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            experimental: false
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux window-system headers (GLFW)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxrandr-dev libxinerama-dev \
              libxcursor-dev libxi-dev libgl-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build and test (CMake; fetches ImGui, GLFW and fonts)
        run: |
          cmake -S editor -B build-editor -DCMAKE_BUILD_TYPE=Release
          cmake --build build-editor --config Release --parallel
          ctest --test-dir build-editor -C Release --output-on-failure

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          make -C editor app
          ditto -c -k --keepParent "build/editor/OSEF Editor.app" OSEF-Editor-macOS.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p osef-editor-linux
          cp build-editor/osef-editor osef-editor-linux/
          cp -R build-editor/fonts osef-editor-linux/fonts
          cp editor/assets/icon.png osef-editor-linux/osef-editor.png
          cp editor/assets/osef-editor.desktop osef-editor-linux/
          tar -czf OSEF-Editor-Linux-x86_64.tar.gz osef-editor-linux

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory osef-editor-windows | Out-Null
          Copy-Item build-editor/Release/osef-editor.exe osef-editor-windows/
          Copy-Item -Recurse build-editor/fonts osef-editor-windows/fonts
          Compress-Archive -Path osef-editor-windows -DestinationPath OSEF-Editor-Windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: editor-${{ runner.os }}
          if-no-files-found: error
          path: |
            OSEF-Editor-*.zip
            OSEF-Editor-*.tar.gz

  # Every push to main that passes all tests publishes a GitHub release with
  # the editor builds and the example ISOs.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [hosted, bare-metal, editor]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        id: files
        run: |
          mkdir -p release
          find artifacts -name 'OSEF-Editor-*' -exec cp {} release/ \;
          # Example ISOs from the bare-metal job (one copy per OS name).
          find artifacts/osef-iso -name '*.iso' | while read -r iso; do
              out="release/$(basename "$iso" .iso)-example.iso"
              [ -f "$out" ] || cp "$iso" "$out"
          done
          ls -la release
          version=$(sed -n 's/^project(OSEF VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag=v${version}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=OSEF ${version} (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.files.outputs.tag }}
          name: ${{ steps.files.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: release/*
          body: |
            Automatic release of `${{ github.sha }}`: every hosted, bare-metal (BIOS + UEFI boot tests in QEMU)
            and editor test passed.

            * **OSEF-Editor-macOS.zip**: unzip and drag *OSEF Editor.app* into Applications. It is ad-hoc
              signed, not notarized: right-click > Open the first time.
            * **OSEF-Editor-Linux-x86_64.tar.gz** / **OSEF-Editor-Windows-x86_64.zip** (experimental): the
              editor with its fonts.
            * ***-example.iso**: the example operating systems, bootable in QEMU or a VM (minimal: BIOS,
              myos: UEFI).

            The editor builds and runs operating systems from an OSEF checkout: clone this repository (or use
            *Source code* below) to `~/OSEF` or `~/Documents/OSEF`, or point `OSEF_ROOT` at it.

  web:
    name: web (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build (WebAssembly)
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web
